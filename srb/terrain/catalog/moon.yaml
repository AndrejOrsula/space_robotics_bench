  # The RAW int16 LPSR raster (this is the .TIF the URL above serves, not
  # the canonical uint8 {0,1,255} rewrite) is tri-valued: DN == 20000 means
  # "permanently shadowed", DN == -32768 means nodata, and everything else
  # (in practice -20000) means "not permanently shadowed". Same rule, same
  # constants as `srb/core/ephemeris/importers.py::_read_pgda_lpsr`'s int16
  # branch -- keep the two in sync. Without this declaration the raw DNs
  # reach `fusion.color.psr_mask`, whose "finite and nonzero" predicate is
  # true for 99.99998% of them, and the entire lunar south pole is classed
  # permanently shadowed.
  mask_encoding:
    masked_values: [20000]
    nodata_values: [-32768]

# --- NAC_POLE_SOUTH_CM_065 / CM_135, band-1 tile P892S2250 (lroc_pds, ---------
# --- kind=color) -------------------------------------------------------------
#
# A two-tile validation reference for sunlit regions: one tile per
# subsolar-longitude bin, both the SAME
# band-1 quadrant tile: the mosaics are stored as polar-stereographic tiles
# in four latitude bands, and band 1 (88.5-90 deg S) is four quadrant tiles
# of which `P892S2250` is the one spanning lon 180-270 deg E -- the one that
# contains Connecting Ridge (89.5017 S, 224.8123 E). Naming is the product's
# own (`P` = polar stereographic, `892` = centre latitude 89.2 S in tenths of
# a degree, `2250` = centre longitude 225.0 E in tenths), per the product
# README served next to the tiles.
#
# `access: download`, NOT `cog_remote`: these are PDS3 `.IMG` rasters with an
# ATTACHED label (GDAL opens them with driver `PDS`, verified on the
# downloaded bytes) and the host serves no COG, so there is no windowed
# remote read available. They are 8.28 GB each, hence
# `allow_large_download: true` -- which on the v2 catalog path is only HALF
# the gate: `SRB_TERRAIN_LARGE_OK` must also be set, or the layer degrades to
# a warning and is skipped (`api._make_layer_loader`), leaving every existing
# bake unchanged.
#
# `reference_only: true` is what keeps pinning these from silently
# re-texturing Connecting Ridge, and `priority_class: 90` is a matching
# DEPRIORITISATION rather than a quality judgement. `priority_class` ALONE
# is not enough and is the wrong tool: it only orders a layer already
# admitted, so these tiles would still enter Connecting Ridge's `color_layers`
# and be fetched and radiometrically processed (`radiometric gain clamped
# on 62.4% / 49.2% of its support`) only to contribute nothing.
# `reference_only` removes them from footprint-driven resolution outright;
# the validation study still reaches them by declaring their `layer_id`s.
# The reason they must not be bake input: each tile is a
# single-subsolar-longitude snapshot with
# deep, real shadow baked into the pixels, and it carries no single
# `sun_azimuth_deg`/`sun_elevation_deg` this catalog could honestly declare
# (each mosaic composites 435+ NAC frames spanning a 10-degree subsolar
# longitude bin, so `fusion.color.deshade_hillshade_divide` has no one
# geometry to divide out and correctly warn-skips). Promoting a
# non-deshadeable shadowed mosaic over the illumination-averaged
# `zenodo_sfs_a3clr06_connridge_omos_5m` base would double-shadow the bake.
# These are pinned to be READ as reference imagery, and they sort last.
#
# Every value below was measured from the downloaded bytes with rasterio
# 1.4.4 / GDAL 3.10.3, not
# transcribed from a product page: sha256 over the whole file, `size_bytes`
# from `stat`, extent/gsd/dtype from the dataset header. Each tile is
# 45488 x 45488 float32 at 1.0 m/px, nodata -3.4028226550889045e+38 (the
# label's `CORE_NULL`, 16#FF7FFFFB#), bounds x/y [-45488, 0] m, in a CRS
# that `transform_bounds` maps onto `IAU_2015:30135` to within 3.3e-9 m --
# i.e. the canonical south-polar frame this repo bakes in. Valid (non-nodata)
# coverage is only ~61% of each tile (the mosaics deliberately omit frames),
# but the Connecting Ridge 3000 m window is 100% valid in both.

