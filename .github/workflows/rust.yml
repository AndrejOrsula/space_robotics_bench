name: Rust

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - "docs/**"
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  MSRV: "1.88"
  ROS_DISTRO: "jazzy"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 120
  CRATE_NAME_GUI: srb_gui

jobs:
  rustfmt:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, X64, ubuntu-latest]
    steps:
      - name: Reclaim workspace ownership
        run: sudo --non-interactive chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use a writable Rust home
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            base="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/srb-rust"
            mkdir -p "$base/cargo/bin" "$base/rustup"
            echo "CARGO_HOME=$base/cargo" >> "$GITHUB_ENV"
            echo "RUSTUP_HOME=$base/rustup" >> "$GITHUB_ENV"
            echo "$base/cargo/bin" >> "$GITHUB_PATH"
            echo "Rust home redirected to $base"
          fi
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all --check --verbose

  cargo:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: rustfmt
    runs-on: [self-hosted, Linux, X64, ubuntu-latest]
    defaults:
      run:
        shell: bash
    container:
      image: ros:jazzy-ros-base
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - MSRV
          - stable
          - beta
    steps:
      - name: Install build prerequisites into the ROS container
        run: |
          printf 'Acquire::Retries "5";\n' > /etc/apt/apt.conf.d/80-srb-retries
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends --yes \
            build-essential ca-certificates clang cmake curl git libssl-dev pkg-config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.event_name == 'push'}}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        if: ${{ matrix.toolchain != 'MSRV' && matrix.toolchain != 'stable' }}
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        if: ${{ matrix.toolchain == 'MSRV' }}
        with:
          toolchain: ${{ env.MSRV }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        if: ${{ matrix.toolchain == 'stable' }}
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      ## cargo check
      - name: cargo check
        run: source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash && cargo check --workspace --all-targets --verbose
      - name: cargo check --no-default-features
        run: source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash && cargo check --workspace --all-targets --no-default-features --verbose
      - name: cargo check --all-features
        run: source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash && cargo check --workspace --all-targets --all-features --verbose

      ## cargo test
      - name: cargo test
        run: source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash && cargo test --workspace --all-targets --verbose
      - name: cargo test --no-default-features
        run: source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash && cargo test --workspace --all-targets --no-default-features --verbose
      - name: cargo test --all-features
        run: source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash && cargo test --workspace --all-targets --all-features --verbose

      ## cargo test --doc
      - name: cargo test --doc
        run: source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash && cargo test --workspace --doc --verbose
      - name: cargo test --doc --no-default-features
        run: source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash && cargo test --workspace --doc --no-default-features --verbose
      - name: cargo test --doc --all-features
        run: source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash && cargo test --workspace --doc --all-features --verbose

      - name: stable | cargo clippy
        if: ${{ matrix.toolchain == 'stable' }}
        run: source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash && cargo clippy --workspace --all-targets --all-features --no-deps --verbose -- --deny warnings

      ## [stable] cargo doc
      - name: stable | cargo doc --document-private-items
        if: ${{ matrix.toolchain == 'stable' }}
        run: source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash && cargo doc --workspace --all-features --no-deps --document-private-items --verbose

      ## [stable] cargo publish --dry-run
      - name: stable | cargo publish --dry-run
        if: ${{ matrix.toolchain == 'stable' }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "pack indices before repack: $(find .git/objects/pack -name '*.idx' | wc -l)"
          git repack -a -d -q
          echo "pack indices after repack: $(find .git/objects/pack -name '*.idx' | wc -l)"
          source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash && cargo publish --dry-run --locked --package ${{ env.CRATE_NAME_GUI }}

      - name: Restore workspace ownership for host jobs
        if: ${{ always() }}
        run: chown -R --reference="${GITHUB_WORKSPACE}/.." "${GITHUB_WORKSPACE}"

  deny:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, X64, ubuntu-latest]
    steps:
      - name: Reclaim workspace ownership
        run: sudo --non-interactive chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check advisories bans licenses sources

  publish:
    if: ${{ github.event_name == 'release' && github.event.release.prerelease == false && github.repository == 'AndrejOrsula/space_robotics_bench' }}
    needs:
      - cargo
      - deny
    runs-on: [self-hosted, Linux, X64, ubuntu-latest]
    defaults:
      run:
        shell: bash
    container:
      image: ros:jazzy-ros-base
    steps:
      - name: Install build prerequisites into the ROS container
        run: |
          printf 'Acquire::Retries "5";\n' > /etc/apt/apt.conf.d/80-srb-retries
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends --yes \
            build-essential ca-certificates clang cmake curl git libssl-dev pkg-config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "srb_gui"))')"
          if [ "${RELEASE_TAG}" != "${crate_version}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match srb_gui version ${crate_version}."
            exit 1
          fi
      - name: Require a crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set, so this release cannot be published to crates.io. Set the secret and re-run, or delete the release."
            exit 1
          fi

      ## Publish to crates.io
      - name: Publish crate (gui)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash && cargo publish --locked --package ${{ env.CRATE_NAME_GUI }}

      - name: Restore workspace ownership for host jobs
        if: ${{ always() }}
        run: chown -R --reference="${GITHUB_WORKSPACE}/.." "${GITHUB_WORKSPACE}"
