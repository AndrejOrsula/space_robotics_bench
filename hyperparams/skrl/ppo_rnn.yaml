models:
  separate: True
  policy:
    class: SRBRecurrentGaussian
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: -2.0
    hidden_size: 128
    num_layers: 1
  value:
    class: SRBRecurrentValue
    clip_actions: False
    hidden_size: 128
    num_layers: 1

memory:
  class: SRBRecurrentRolloutBuffer
  memory_size: 256
  sequence_length: 16

agent:
  class: SRBRecurrentPPO
  rollouts: 64
  learning_epochs: 16
  mini_batches: 8
  discount_factor: 0.997
  gae_lambda: 0.9
  learning_rate: 1.0e-4
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: {}
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 0.5
  ratio_clip: 0.1
  value_clip: 0.1
  entropy_loss_scale: 0.01
  value_loss_scale: 0.5
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False
  experiment:
    directory: "MISSING"
    experiment_name: "MISSING"
    write_interval: auto
    checkpoint_interval: 1000
    wandb: False

trainer:
  class: SRBRecurrentTrainer
  timesteps: 200000000
  environment_info: log
