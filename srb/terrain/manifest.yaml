# Curated-site catalog for SRB real-terrain pipeline.
#
# Each site lists the canonical DEM source (and optionally an orthorectified
# image overlay). A site still being curated uses "f" * 64 as its sha256 and
# refuses to bake until the real hash is backfilled.
#
# Add new sites in lower_snake_case alphabetical order within each body.

version: 2

sites:

