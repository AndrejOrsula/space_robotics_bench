name: pre-commit

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  SKIP: cargo-fmt

jobs:
  pre-commit:
    name: Code Hygiene & Formatting
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure --color=always
      - name: Apply fixes with pre-commit-ci-lite
        uses: pre-commit-ci/lite-action@062bca0919bc9d6e66755cc05074b70c77e111fc
        if: always()
