run:
  steps: 1000000000
  train_ratio: 32.0
replay:
  size: 2560000
  online: True
  fracs: { uniform: 0.2, priority: 0.5, recency: 0.3 }
  chunksize: 2048
  save: False
jax:
  platform: cuda
  compute_dtype: bfloat16
  prealloc: False
  jit: True

logger:
  outputs: [
      # jsonl,
      # scope,
      tensorboard,
      # wandb,
    ]
  filter: "score|length|fps|ratio|train/loss/|train/rand/"
  timer: False
  fps: 10
run.log_every: 120
run.report_every: 300
run.save_every: 1200
run.usage:
  { psutil: False, nvsmi: False, gputil: False, malloc: False, gc: False }
run.debug: False
jax.debug: False

## 200M; other sizes: `size*` presets in upstream dreamerv3/configs.yaml
.*\.rssm: { deter: 8192, hidden: 1024, classes: 64 }
.*\.depth: 64
.*\.units: 1024

## Task-specific profiles live in hyperparams/task/<task>/dreamerv3.yaml.
