name: Docs

on:
  push:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "*.md"
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08
        with:
          mdbook-version: "0.5.3"
      - name: Build
        run: mdbook build docs --dest-dir /tmp/srb-docs
      - name: Upload artifact
        if: ${{ github.event_name != 'pull_request' && github.repository == 'AndrejOrsula/space_robotics_bench' && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: /tmp/srb-docs

  deploy:
    if: ${{ (github.event_name != 'pull_request' && github.repository == 'AndrejOrsula/space_robotics_bench') && (github.event_name != 'push' || github.ref == 'refs/heads/main') && (github.event_name != 'release' || github.event.release.prerelease == false) }}
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
