name: Rust

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - "docs/**"
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all --check

  cargo:
    needs: rustfmt
    runs-on: ubuntu-26.04
    container:
      image: ros:jazzy-ros-base
    env:
      BASH_ENV: /opt/ros/jazzy/setup.bash
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.88"
          - stable
          - beta
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends --yes \
            build-essential ca-certificates clang cmake curl git libssl-dev pkg-config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.event_name == 'push' }}
      - name: cargo test
        run: cargo test --workspace --all-features --locked
      - name: cargo clippy
        if: ${{ matrix.toolchain == 'stable' }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- --deny warnings
      - name: cargo doc
        if: ${{ matrix.toolchain == 'stable' }}
        run: cargo doc --workspace --all-features --no-deps --document-private-items --locked
      - name: cargo publish --dry-run
        if: ${{ matrix.toolchain == 'stable' }}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          cargo publish --dry-run --locked --package srb_gui

  deny:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check advisories bans licenses sources

  publish:
    if: ${{ github.event_name == 'release' && github.event.release.prerelease == false && github.repository == 'AndrejOrsula/space_robotics_bench' }}
    needs:
      - cargo
      - deny
    runs-on: ubuntu-26.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    container:
      image: ros:jazzy-ros-base
    env:
      BASH_ENV: /opt/ros/jazzy/setup.bash
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends --yes \
            build-essential ca-certificates clang cmake curl git libssl-dev pkg-config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "srb_gui"))')"
          if [ "${RELEASE_TAG}" != "${crate_version}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match srb_gui version ${crate_version}."
            exit 1
          fi
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        continue-on-error: true
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::Neither crates.io trusted publishing nor the CARGO_REGISTRY_TOKEN secret is configured."
            exit 1
          fi
          cargo publish --locked --package srb_gui
