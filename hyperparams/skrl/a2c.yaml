models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: -2.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [384, 384]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [384, 384]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: 8

agent:
  class: A2C
  rollouts: 8
  mini_batches: 1
  discount_factor: 0.997
  gae_lambda: 0.9
  learning_rate: 3.0e-4
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: {}
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 0.5
  entropy_loss_scale: 0.01
  rewards_shaper_scale: 1.0
  experiment:
    directory: "MISSING"
    experiment_name: "MISSING"
    write_interval: auto
    checkpoint_interval: 1000
    wandb: False

trainer:
  class: SequentialTrainer
  timesteps: 200000000
  environment_info: log
