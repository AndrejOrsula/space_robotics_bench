models:
  separate: True
  policy:
    class: DeterministicMixin
    clip_actions: True
    network:
      - name: net
        input: OBSERVATIONS
        layers: [384, 384]
        activations: elu
    output: tanh(ACTIONS)
  target_policy:
    class: DeterministicMixin
    clip_actions: True
    network:
      - name: net
        input: OBSERVATIONS
        layers: [384, 384]
        activations: elu
    output: tanh(ACTIONS)
  critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([STATES, ACTIONS])
        layers: [384, 384]
        activations: elu
    output: ONE
  critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([STATES, ACTIONS])
        layers: [384, 384]
        activations: elu
    output: ONE
  target_critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([STATES, ACTIONS])
        layers: [384, 384]
        activations: elu
    output: ONE
  target_critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([STATES, ACTIONS])
        layers: [384, 384]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: 5000000

agent:
  class: TD3
  gradient_steps: 4
  batch_size: 512
  discount_factor: 0.997
  polyak: 0.005
  learning_rate: [3.0e-4, 3.0e-4]
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: {}
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  random_timesteps: 50000
  learning_starts: 50000
  grad_norm_clip: 0.0
  policy_delay: 2
  smooth_regularization_noise: GaussianNoise(mean=0.0, std=0.2)
  smooth_regularization_noise_kwargs: {}
  smooth_regularization_clip: 0.5
  exploration_noise: GaussianNoise(mean=0.0, std=0.1)
  exploration_noise_kwargs: {}
  exploration_scheduler: null
  rewards_shaper_scale: 1.0
  experiment:
    directory: "MISSING"
    experiment_name: "MISSING"
    write_interval: auto
    checkpoint_interval: 1000
    wandb: False

trainer:
  class: SequentialTrainer
  timesteps: 100000000
  environment_info: log
