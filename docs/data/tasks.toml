# Task metadata not derivable from code.
# schema_version 1: other top-level keys are task tables named by short task
# id; `[<task>.gui]` is the only nested table.
# `success_signal` declares how a paper task reports success for bounded
# evaluation: "episode_info" when it publishes `success` in episode info;
# "return_only" when only the return is reported. Required on every paper task
# and must agree with its source.
schema_version = 1

