name: Docs

on:
  push:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/docs.yml"
      - ".gitmodules"
      - "docs/**"
      - "*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  MDBOOK_VERSION: "0.5.3"

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install mdBook
        run: |
          mkdir -p "${RUNNER_TEMP}/mdbook"
          curl --proto "=https" --tlsv1.2 -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "${RUNNER_TEMP}/mdbook"
          echo "${RUNNER_TEMP}/mdbook" >> "${GITHUB_PATH}"
      - name: Build
        run: mdbook build docs --dest-dir /tmp/srb-docs
      - name: Upload artifact
        if: ${{ github.event_name != 'pull_request' && github.repository == 'AndrejOrsula/space_robotics_bench' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: /tmp/srb-docs

  deploy:
    if: ${{ github.event_name != 'pull_request' && github.repository == 'AndrejOrsula/space_robotics_bench' && github.ref == 'refs/heads/main' }}
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
