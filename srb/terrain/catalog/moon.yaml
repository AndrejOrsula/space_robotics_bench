# --- SfS A3CLR regions (zenodo, PGDA product 104; DEM + orthomosaic) ---------
#
# One Zenodo record (doi 10.5281/zenodo.17954508) ships 13 per-region `.zip`
# archives, each a full Goddard-Lunar-Data (GLD) product suite on a common 5
# m/px grid. Two members per region are pinned here: GLD01 (`*_GLDELEV_*.tif`,
# the SfS elevation) and GLD08 (`*_GLDOMOS_*.tif`, the maximally-lit LROC NAC
# orthomosaic). `access: zip_member` -- the v2 loader supports exactly ONE
# extracted member per layer (`api.py::_v2_layer_loader`), so DEM and
# orthomosaic are two layers over the SAME archive; the content-addressed raw
# cache keys on the archive sha256, so the 2-4 GB download happens once and
# both layers reuse it. `allow_large_download: true` + SRB_TERRAIN_LARGE_OK
# is therefore REQUIRED to fetch either one.
#
# `radiometry: illumination_averaged` on the orthomosaics, NOT the
# `single_illumination` the documented catalog semantics guessed for "SfS
# A3CLR orthos": the archive's own per-region README describes GLD08 as a
# "maximally-lit orthomosaic ... For each pixel, the brightest valid input
# pixel is selected. This yields a mosaic with apparent illumination from
# multiple azimuths while emphasizing all illuminated terrain" -- i.e. a
# multi-temporal composite with no single sun geometry, exactly like
# `lroc_nac_roi_haworth_lo1_20m`'s "optimized illuminated terrain coverage"
# mosaic, which this catalog already classes `illumination_averaged`. The
# class is metadata-only here: both classes route to the same sunlit stack
# (`resolve._is_sunlit_radiometry`), and `fusion.color.deshade_hillshade_divide`
# warn-and-skips either way for lack of `sun_azimuth_deg`/`sun_elevation_deg`
# (`fusion.engine._deshade_color_stack` gates on the sun geometry, never on
# radiometry). `illumination_averaged` is chosen because it is what the
# product *is*.
#
# Only the two regions that actually contain a site this repo bakes are
# pinned. A3CLR22-#6 (Connecting Ridge) contains the study's Connecting Ridge
# center and provides that site's colour; A3CLR22-#2
# (Haworth) contains the study's Haworth center. The other eleven regions --
# including #3 "Faustini Rim A", whose footprint lies ~0.3 deg poleward of the
# study's Faustini site (the ShadowCam DTM patch INSIDE the crater) and does
# not contain it -- are deliberately not pinned.

