[zeroglab_arms]
notes = "Two arms (ceiling and wall) share this configuration, each with a `rail_joint` and six arm joints. DoF, actuators, and initial joints are per arm; `dual_arm_osc` drives both arms with 12 dimensions each."

[unitree_g1]
notes = "The DoF and `joint_pos` action dimensions are runtime-resolved from the Unitree G1 USD articulation. The actuator configuration includes shoulder, elbow, ankle, and hand-like `zero` through `six` joint patterns."

[iss_gateway_scenery]
notes = "Set `station_template_usd_path` on `ISSGatewayScenery` to use a single static station USD while retaining static collision geometry for stable benchmark scenes. Align segment handrails with benchmark waypoint paths using `handrail_segment_specs`; `handrail_specs` is shorthand for X-axis rails."
