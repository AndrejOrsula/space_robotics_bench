[package]
name = "srb_gui"
authors.workspace = true
categories.workspace = true
description = "GUI for the Space Robotics Bench"
documentation.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
publish = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.cargo-machete]
# Keep winit's native X11 and Wayland backends enabled with eframe defaults off.
ignored = ["winit"]

[[bin]]
name = "gui"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4" }
eframe = { version = "0.33", default-features = false, features = [
    "accesskit",
    "glow",
    "persistence",
] }
egui = { version = "0.33", default-features = false }
egui_plot = { version = "0.34", default-features = false }
egui_commonmark = { version = "0.22", default-features = false, features = [
    "better_syntax_highlighting",
    "macros",
    "pulldown_cmark",
] }
egui_extras = { version = "0.33", default-features = false, features = [
    "all_loaders",
    "syntect",
] }
futures = "0.3"
home = { version = "0.5" }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
] }
nix = { version = "0.31", features = ["signal"] }
r2r = { version = "0.9" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
strum = { version = "0.28", features = ["derive"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
typed-builder = { version = "0.23" }
winit = { version = "0.30" }
