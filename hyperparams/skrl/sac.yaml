models:
  separate: True
  policy:
    class: SRBSquashedGaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: -2.0
    action_epsilon: 1.0e-6
    network:
      - name: net
        input: OBSERVATIONS
        layers: [384, 384]
        activations: elu
    output: ACTIONS
  critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([STATES, ACTIONS])
        layers: [384, 384]
        activations: elu
    output: ONE
  critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([STATES, ACTIONS])
        layers: [384, 384]
        activations: elu
    output: ONE
  target_critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([STATES, ACTIONS])
        layers: [384, 384]
        activations: elu
    output: ONE
  target_critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([STATES, ACTIONS])
        layers: [384, 384]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: 5000000

agent:
  class: SAC
  gradient_steps: 1
  batch_size: 512
  discount_factor: 0.997
  polyak: 0.005
  learning_rate: [3.0e-4, 3.0e-4, 3.0e-4]
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: {}
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  random_timesteps: 50000
  learning_starts: 50000
  grad_norm_clip: 0.0
  learn_entropy: True
  initial_entropy_value: 1.0
  target_entropy: null
  rewards_shaper_scale: 1.0
  mixed_precision: False
  experiment:
    directory: "MISSING"
    experiment_name: "MISSING"
    write_interval: auto
    checkpoint_interval: 1000
    wandb: False

trainer:
  class: SequentialTrainer
  timesteps: 100000000
  environment_info: log
