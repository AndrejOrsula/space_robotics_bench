name: Docker

on:
  push:
    branches: [dev, main]
    paths-ignore: ["docs/**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

env:
  SOURCE_HELPER_PIN_FILE: .docker/helpers/release/source_provenance.sha256
  SOURCE_HELPER_BASH: .docker/helpers/release/source_provenance.bash
  SOURCE_HELPER_PYTHON: .docker/helpers/release/source_provenance.py
  CONTAINER_PROVENANCE: .docker/helpers/release/container_provenance.py
  PREDICATE_TYPE: https://space-robotics-bench.github.io/attestations/container-source/v1

jobs:
  build:
    permissions:
      contents: read
    runs-on: [self-hosted, Linux, X64]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'release' || github.event.release.prerelease == false) }}
    steps:
      - name: Reclaim workspace ownership
        run: sudo --non-interactive chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"

      - name: Check free disk space
        run: |
          set -uo pipefail
          free_gb() {
            df --output=avail -BG "${GITHUB_WORKSPACE}" | tail -1 | tr -dc '0-9'
          }
          require_gb() {
            case "$1" in
              "" | *[!0-9]*)
                echo "::error::could not read free space for ${GITHUB_WORKSPACE}; df produced '$1'"
                exit 1
                ;;
            esac
          }
          free_before="$(free_gb)"
          require_gb "${free_before}"
          echo "free=${free_before} GB"
          if [ "${free_before}" -ge 100 ]; then
            exit 0
          fi
          echo "under the 100 GB threshold; reclaiming dangling images and stale build cache"
          docker image prune --force || true
          docker builder prune --force --filter until=168h || true
          free_after="$(free_gb)"
          require_gb "${free_after}"
          echo "free=${free_after} GB after reclaim"
          if [ "${free_after}" -lt 100 ]; then
            echo "::error::Only ${free_after} GB free after reclaiming dangling images and build cache; the Docker build needs at least 100 GB. The threshold is sized for a cold build and lowering it trades a clear failure here for an ENOSPC part-way through."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      ## Extract metadata (tags, labels) from Git reference and GitHub events for the Docker image
      - name: Extract build metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ghcr.io/${{ github.repository_owner }}/srb
            ${{ github.repository }}

      - name: Verify reviewed checkout and pin source helper
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() {
            echo "::error::$*" >&2
            printf 'Checkout status (paths only; no cleanup):\n' >&2
            git -c core.quotePath=true status --porcelain=v1 --untracked-files=all >&2 || true
            git submodule foreach --recursive \
              'git -c core.quotePath=true status --porcelain=v1 --untracked-files=all' >&2 || true
            exit 1
          }
          cd "${GITHUB_WORKSPACE}"
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || fail "checkout HEAD is not GITHUB_SHA"
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || fail "checkout is dirty"
          submodules="$(git submodule status --recursive)"
          while IFS= read -r line; do
            [[ -z "${line}" ]] && continue
            marker="${line:0:1}"
            [[ "${marker}" == " " ]] || fail "recursive submodule is unpopulated or changed: ${line}"
            read -r expected path _ <<< "${line:1}"
            [[ -n "${expected}" && -n "${path}" ]] || fail "malformed submodule status: ${line}"
            observed="$(git -C "${path}" rev-parse HEAD)" || fail "cannot inspect submodule ${path}"
            [[ "${observed}" == "${expected}" ]] || fail "submodule ${path} HEAD differs from gitlink"
            git -C "${path}" diff --quiet || fail "submodule ${path} worktree is dirty"
            git -C "${path}" diff --cached --quiet || fail "submodule ${path} index is dirty"
            [[ -z "$(git -C "${path}" status --porcelain=v1 --untracked-files=all)" ]] || fail "submodule ${path} has untracked files"
          done <<< "${submodules}"

          pin="${GITHUB_WORKSPACE}/${SOURCE_HELPER_PIN_FILE}"
          [[ -f "${pin}" ]] || fail "source helper pin is missing"
          declare -A expected_hashes=()
          while IFS=$'\t' read -r digest path; do
            [[ -n "${digest}" && -n "${path}" ]] || fail "malformed source helper pin"
            [[ -z "${expected_hashes[${path}]+present}" ]] || fail "duplicate source helper pin: ${path}"
            case "${path}" in
              "${SOURCE_HELPER_BASH}"|"${SOURCE_HELPER_PYTHON}") ;;
              *) fail "source helper pin contains unexpected path: ${path}" ;;
            esac
            [[ "${digest}" =~ ^[0-9a-f]{64}$ ]] || fail "source helper pin is not lowercase SHA-256: ${path}"
            expected_hashes["${path}"]="${digest}"
            printf '%s  %s\n' "${digest}" "${GITHUB_WORKSPACE}/${path}" | sha256sum --check --strict -
          done < <(awk 'NF >= 2 && $1 !~ /^#/ {gsub(/^\*/, "", $2); print $1 "\t" $2}' "${pin}")
          [[ "${#expected_hashes[@]}" -eq 2 ]] || fail "source helper pin must contain exactly two files"

          tool_dir="$(mktemp -d "${RUNNER_TEMP}/srb-source-tools.XXXXXX")"
          cp -- "${GITHUB_WORKSPACE}/${SOURCE_HELPER_BASH}" "${tool_dir}/source_provenance.bash"
          cp -- "${GITHUB_WORKSPACE}/${SOURCE_HELPER_PYTHON}" "${tool_dir}/source_provenance.py"
          for path in "${SOURCE_HELPER_BASH}" "${SOURCE_HELPER_PYTHON}"; do
            basename="$(basename "${path}")"
            printf '%s  %s\n' "${expected_hashes[${path}]}" "${tool_dir}/${basename}" | sha256sum --check --strict -
          done
          chmod 0444 "${tool_dir}/source_provenance.bash" "${tool_dir}/source_provenance.py"
          printf 'SRB_SOURCE_TOOL_DIR=%s\n' "${tool_dir}" >> "${GITHUB_ENV}"

      - name: Generate external source manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          manifest="${RUNNER_TEMP}/srb-source-provenance.json"
          bash "${SRB_SOURCE_TOOL_DIR}/source_provenance.bash" generate \
            --source "${GITHUB_WORKSPACE}" --manifest "${manifest}" --json \
            > "${RUNNER_TEMP}/source-provenance-generation.json"
          [[ -s "${manifest}" ]] || fail "source helper did not produce a manifest"
          source_env="${RUNNER_TEMP}/srb-source-provenance.env"
          python3 - "${manifest}" "${source_env}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          manifest_path, env_path = map(Path, sys.argv[1:])
          document = json.loads(manifest_path.read_text(encoding="utf-8"))
          snapshot_id = document.get("snapshot_id")
          tree_digest = document.get("tree_digest")
          if not isinstance(snapshot_id, str) or re.fullmatch(
              r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",
              snapshot_id,
          ) is None:
              raise SystemExit("source manifest has no canonical snapshot_id")
          if not isinstance(tree_digest, str) or re.fullmatch(r"[0-9a-f]{64}", tree_digest) is None:
              raise SystemExit("source manifest has no lowercase tree_digest")
          env_path.write_text(
              f"SRB_SOURCE_SNAPSHOT_ID={snapshot_id}\nSRB_SOURCE_TREE_DIGEST={tree_digest}\n",
              encoding="utf-8",
          )
          PY
          manifest_sha256="$(sha256sum "${manifest}" | awk '{print $1}')"
          snapshot_id="$(sed -n 's/^SRB_SOURCE_SNAPSHOT_ID=//p' "${source_env}")"
          tree_digest="$(sed -n 's/^SRB_SOURCE_TREE_DIGEST=//p' "${source_env}")"
          {
            printf 'SRB_SOURCE_SNAPSHOT_ID=%s\n' "${snapshot_id}"
            printf 'SRB_SOURCE_TREE_DIGEST=%s\n' "${tree_digest}"
            printf 'SRB_SOURCE_PROVENANCE_MANIFEST=%s\n' "${manifest}"
            printf 'SRB_SOURCE_MANIFEST_SHA256=%s\n' "${manifest_sha256}"
            printf 'SRB_SOURCE_PROVENANCE_HELPER=%s\n' "${SRB_SOURCE_TOOL_DIR}/source_provenance.bash"
          } > "${source_env}"
          cat "${source_env}" >> "${GITHUB_ENV}"
          printf 'SRB_SOURCE_ENV_FILE=%s\n' "${source_env}" >> "${GITHUB_ENV}"

      - name: Resolve immutable amd64 base image
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          base_name="$(sed -n 's/^ARG BASE_IMAGE_NAME="\(.*\)"$/\1/p' "${GITHUB_WORKSPACE}/Dockerfile" | head -n 1)"
          base_tag="$(sed -n 's/^ARG BASE_IMAGE_TAG="\(.*\)"$/\1/p' "${GITHUB_WORKSPACE}/Dockerfile" | head -n 1)"
          [[ -n "${base_name}" && -n "${base_tag}" && "${base_tag}" != *@* ]] || fail "Dockerfile base image declaration is not a plain reviewed tag"
          base_ref="${base_name}:${base_tag}"
          raw="${RUNNER_TEMP}/srb-base-image.raw.json"
          docker buildx imagetools inspect "${base_ref}" --raw > "${raw}"
          digest="$(python3 - "${raw}" <<'PY'
          import json
          import sys

          document = json.load(open(sys.argv[1], encoding="utf-8"))
          for descriptor in document.get("manifests", []):
              platform = descriptor.get("platform", {})
              if platform.get("os") == "linux" and platform.get("architecture") == "amd64":
                  print(descriptor.get("digest", ""))
                  break
          PY
          )"
          if [[ -z "${digest}" ]]; then
            digest="$(docker buildx imagetools inspect "${base_ref}" --format '{{.Manifest.Digest}}')"
          fi
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "base image did not resolve to an amd64 digest"
          base_env="${RUNNER_TEMP}/srb-base-image.env"
          {
            printf 'SRB_BASE_IMAGE_NAME=%s\n' "${base_name}"
            printf 'SRB_BASE_IMAGE_TAG=%s\n' "${base_tag}"
            printf 'SRB_BASE_IMAGE_DIGEST=%s\n' "${digest}"
            printf 'SRB_BASE_IMAGE_TAG_PINNED=%s@%s\n' "${base_tag}" "${digest}"
          } > "${base_env}"
          python3 - "${RUNNER_TEMP}/srb-base-image.json" "${base_name}" "${base_tag}" "${digest}" <<'PY'
          import json
          import sys
          from pathlib import Path

          output, name, tag, digest = sys.argv[1:]
          Path(output).write_text(
              json.dumps(
                  {
                      "name": name,
                      "tag": tag,
                      "digest": digest,
                      "platform": "linux/amd64",
                      "build_arg": f"{tag}@{digest}",
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          cat "${base_env}" >> "${GITHUB_ENV}"
          printf 'SRB_BASE_ENV_FILE=%s\n' "${base_env}" >> "${GITHUB_ENV}"

      - name: Verify source before strict build
        shell: bash
        run: |
          set -Eeuo pipefail
          source "${SRB_SOURCE_ENV_FILE}"
          bash "${SRB_SOURCE_PROVENANCE_HELPER}" verify \
            --root "${GITHUB_WORKSPACE}" --manifest "${SRB_SOURCE_PROVENANCE_MANIFEST}" \
            --expected-snapshot-id "${SRB_SOURCE_SNAPSHOT_ID}" \
            --expected-tree-digest "${SRB_SOURCE_TREE_DIGEST}" --json \
            > "${RUNNER_TEMP}/source-prebuild-verify.json"

      - name: Build strict immutable source context
        env:
          METADATA_LABELS: ${{ steps.metadata.outputs.labels }}
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          source "${SRB_SOURCE_ENV_FILE}"
          source "${SRB_BASE_ENV_FILE}"
          [[ -n "${METADATA_LABELS}" ]] || fail "metadata action produced no OCI labels"
          metadata_label_args=()
          while IFS= read -r label; do
            [[ -z "${label}" ]] && continue
            [[ "${label}" == *=* ]] || fail "metadata label is not key=value"
            key="${label%%=*}"
            value="${label#*=}"
            [[ "${key}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || fail "metadata label key is malformed: ${key}"
            case "${key}" in
              org.space-robotics-bench.source.provenance-version|org.space-robotics-bench.source.snapshot-id|org.space-robotics-bench.source.tree-digest)
                fail "metadata action attempted to set a protected source label: ${key}"
                ;;
            esac
            [[ "${value}" != *$'\r'* && "${value}" != *$'\n'* ]] || fail "metadata label value contains a line break: ${key}"
            metadata_label_args+=(--label "${label}")
          done <<< "${METADATA_LABELS}"
          iid_file="${RUNNER_TEMP}/srb-build.iid"
          rm -f -- "${iid_file}"
          SRB_SOURCE_PROVENANCE_REQUIRED=1 \
          SRB_SOURCE_SNAPSHOT_ID="${SRB_SOURCE_SNAPSHOT_ID}" \
          SRB_SOURCE_TREE_DIGEST="${SRB_SOURCE_TREE_DIGEST}" \
          SRB_SOURCE_PROVENANCE_HELPER="${SRB_SOURCE_PROVENANCE_HELPER}" \
          SRB_SOURCE_PROVENANCE_MANIFEST="${SRB_SOURCE_PROVENANCE_MANIFEST}" \
          SRB_BUILD_NETWORK=default \
          SRB_IMAGE_NAME="srb-ci" \
            "${GITHUB_WORKSPACE}/.docker/build.bash" "${GITHUB_SHA}" \
            "${metadata_label_args[@]}" \
            --platform linux/amd64 --iidfile "${iid_file}" \
            --build-arg "BASE_IMAGE_NAME=${SRB_BASE_IMAGE_NAME}" \
            --build-arg "BASE_IMAGE_TAG=${SRB_BASE_IMAGE_TAG_PINNED}"
          [[ -s "${iid_file}" ]] || { echo "::error::strict builder produced no IID"; exit 1; }
          printf 'SRB_IID_FILE=%s\n' "${iid_file}" >> "${GITHUB_ENV}"
          printf 'SRB_IMAGE_IID=%s\n' "$(<"${iid_file}")" >> "${GITHUB_ENV}"

      - name: Verify source after strict build
        shell: bash
        run: |
          set -Eeuo pipefail
          source "${SRB_SOURCE_ENV_FILE}"
          bash "${SRB_SOURCE_PROVENANCE_HELPER}" verify \
            --root "${GITHUB_WORKSPACE}" --manifest "${SRB_SOURCE_PROVENANCE_MANIFEST}" \
            --expected-snapshot-id "${SRB_SOURCE_SNAPSHOT_ID}" \
            --expected-tree-digest "${SRB_SOURCE_TREE_DIGEST}" --json \
            > "${RUNNER_TEMP}/source-postbuild-verify.json"

      - name: Validate fresh IID and light CLI smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          source "${SRB_SOURCE_ENV_FILE}"
          iid="$(<"${SRB_IID_FILE}")"
          [[ "${iid}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::malformed strict IID"; exit 1; }
          platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${iid}")"
          [[ "${platform}" == "linux/amd64" ]] || { echo "::error::fresh IID platform is ${platform}, expected linux/amd64"; exit 1; }
          record="$(docker image inspect --format '{{.Id}}{{"\t"}}{{index .Config.Labels "org.space-robotics-bench.source.provenance-version"}}{{"\t"}}{{index .Config.Labels "org.space-robotics-bench.source.snapshot-id"}}{{"\t"}}{{index .Config.Labels "org.space-robotics-bench.source.tree-digest"}}' "${iid}")"
          [[ "${record}" == "${iid}"$'\t1\t'"${SRB_SOURCE_SNAPSHOT_ID}"$'\t'"${SRB_SOURCE_TREE_DIGEST}" ]] || { echo "::error::fresh IID source labels do not match"; exit 1; }
          docker image inspect "${iid}" > "${RUNNER_TEMP}/srb-local-image-inspect.json"
          docker run --rm --entrypoint bash "${iid}" -lc 'srb --help && python3 -c "import srb.cli.registry"'
          evidence="${RUNNER_TEMP}/srb-docker-build-evidence"
          mkdir -p "${evidence}"
          cp -- "${SRB_SOURCE_PROVENANCE_MANIFEST}" "${evidence}/source-manifest.json"
          cp -- "${SRB_IID_FILE}" "${evidence}/image.iid"
          cp -- "${RUNNER_TEMP}/srb-base-image.json" "${evidence}/base-image.json"
          cp -- "${RUNNER_TEMP}/source-prebuild-verify.json" "${evidence}/source-prebuild-verify.json"
          cp -- "${RUNNER_TEMP}/source-postbuild-verify.json" "${evidence}/source-postbuild-verify.json"
          cp -- "${RUNNER_TEMP}/srb-local-image-inspect.json" "${evidence}/local-image-inspect.json"

      - name: Upload credential-free build evidence
        if: ${{ always() && github.event_name == 'release' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-build-evidence
          path: ${{ runner.temp }}/srb-docker-build-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Remove local build image
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          remove_image() {
            local inspect_error
            docker image rm -f "$1" >/dev/null 2>&1 || :
            if docker image inspect "$1" >/dev/null 2>&1; then
              echo "::warning title=Docker cleanup::image $1 is still present after removal"
            elif ! inspect_error="$(docker image inspect "$1" 2>&1 >/dev/null)" \
              && ! grep -qi "no such image" <<<"${inspect_error}"; then
              echo "::warning title=Docker cleanup::could not verify removal of image $1: ${inspect_error}"
            fi
          }
          if [[ -s "${RUNNER_TEMP}/srb-build.iid" ]]; then
            remove_image "$(<"${RUNNER_TEMP}/srb-build.iid")"
          fi

  publish:
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: [self-hosted, Linux, X64]
    if: ${{ needs.build.result == 'success' && github.event_name == 'release' && github.event.release.prerelease == false && github.actor != 'dependabot[bot]' && github.repository == 'AndrejOrsula/space_robotics_bench' }}
    steps:
      - name: Reclaim workspace ownership
        run: sudo --non-interactive chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"

      - name: Check free disk space
        run: |
          set -uo pipefail
          free_gb() {
            df --output=avail -BG "${GITHUB_WORKSPACE}" | tail -1 | tr -dc '0-9'
          }
          require_gb() {
            case "$1" in
              "" | *[!0-9]*)
                echo "::error::could not read free space for ${GITHUB_WORKSPACE}; df produced '$1'"
                exit 1
                ;;
            esac
          }
          free_before="$(free_gb)"
          require_gb "${free_before}"
          echo "free=${free_before} GB"
          if [ "${free_before}" -ge 100 ]; then
            exit 0
          fi
          echo "under the 100 GB threshold; reclaiming dangling images and stale build cache"
          docker image prune --force || true
          docker builder prune --force --filter until=168h || true
          free_after="$(free_gb)"
          require_gb "${free_after}"
          echo "free=${free_after} GB after reclaim"
          if [ "${free_after}" -lt 100 ]; then
            echo "::error::Only ${free_after} GB free after reclaiming dangling images and build cache; the Docker build needs at least 100 GB. The threshold is sized for a cold build and lowering it trades a clear failure here for an ENOSPC part-way through."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      ## Extract metadata (tags, labels) from Git reference and GitHub events for the Docker image
      - name: Extract release metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ghcr.io/${{ github.repository_owner }}/srb
            ${{ github.repository }}

      - name: Verify reviewed checkout and pin source helper
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() {
            echo "::error::$*" >&2
            printf 'Checkout status (paths only; no cleanup):\n' >&2
            git -c core.quotePath=true status --porcelain=v1 --untracked-files=all >&2 || true
            git submodule foreach --recursive \
              'git -c core.quotePath=true status --porcelain=v1 --untracked-files=all' >&2 || true
            exit 1
          }
          cd "${GITHUB_WORKSPACE}"
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || fail "checkout HEAD is not GITHUB_SHA"
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || fail "checkout is dirty"
          submodules="$(git submodule status --recursive)"
          while IFS= read -r line; do
            [[ -z "${line}" ]] && continue
            marker="${line:0:1}"
            [[ "${marker}" == " " ]] || fail "recursive submodule is unpopulated or changed: ${line}"
            read -r expected path _ <<< "${line:1}"
            [[ -n "${expected}" && -n "${path}" ]] || fail "malformed submodule status: ${line}"
            observed="$(git -C "${path}" rev-parse HEAD)" || fail "cannot inspect submodule ${path}"
            [[ "${observed}" == "${expected}" ]] || fail "submodule ${path} HEAD differs from gitlink"
            git -C "${path}" diff --quiet || fail "submodule ${path} worktree is dirty"
            git -C "${path}" diff --cached --quiet || fail "submodule ${path} index is dirty"
            [[ -z "$(git -C "${path}" status --porcelain=v1 --untracked-files=all)" ]] || fail "submodule ${path} has untracked files"
          done <<< "${submodules}"

          pin="${GITHUB_WORKSPACE}/${SOURCE_HELPER_PIN_FILE}"
          [[ -f "${pin}" ]] || fail "source helper pin is missing"
          declare -A expected_hashes=()
          while IFS=$'\t' read -r digest path; do
            [[ -n "${digest}" && -n "${path}" ]] || fail "malformed source helper pin"
            [[ -z "${expected_hashes[${path}]+present}" ]] || fail "duplicate source helper pin: ${path}"
            case "${path}" in
              "${SOURCE_HELPER_BASH}"|"${SOURCE_HELPER_PYTHON}") ;;
              *) fail "source helper pin contains unexpected path: ${path}" ;;
            esac
            [[ "${digest}" =~ ^[0-9a-f]{64}$ ]] || fail "source helper pin is not lowercase SHA-256: ${path}"
            expected_hashes["${path}"]="${digest}"
            printf '%s  %s\n' "${digest}" "${GITHUB_WORKSPACE}/${path}" | sha256sum --check --strict -
          done < <(awk 'NF >= 2 && $1 !~ /^#/ {gsub(/^\*/, "", $2); print $1 "\t" $2}' "${pin}")
          [[ "${#expected_hashes[@]}" -eq 2 ]] || fail "source helper pin must contain exactly two files"

          tool_dir="$(mktemp -d "${RUNNER_TEMP}/srb-source-tools.XXXXXX")"
          cp -- "${GITHUB_WORKSPACE}/${SOURCE_HELPER_BASH}" "${tool_dir}/source_provenance.bash"
          cp -- "${GITHUB_WORKSPACE}/${SOURCE_HELPER_PYTHON}" "${tool_dir}/source_provenance.py"
          for path in "${SOURCE_HELPER_BASH}" "${SOURCE_HELPER_PYTHON}"; do
            basename="$(basename "${path}")"
            printf '%s  %s\n' "${expected_hashes[${path}]}" "${tool_dir}/${basename}" | sha256sum --check --strict -
          done
          chmod 0444 "${tool_dir}/source_provenance.bash" "${tool_dir}/source_provenance.py"
          printf 'SRB_SOURCE_TOOL_DIR=%s\n' "${tool_dir}" >> "${GITHUB_ENV}"

      - name: Generate external source manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          manifest="${RUNNER_TEMP}/srb-source-provenance.json"
          bash "${SRB_SOURCE_TOOL_DIR}/source_provenance.bash" generate \
            --source "${GITHUB_WORKSPACE}" --manifest "${manifest}" --json \
            > "${RUNNER_TEMP}/source-provenance-generation.json"
          [[ -s "${manifest}" ]] || fail "source helper did not produce a manifest"
          source_env="${RUNNER_TEMP}/srb-source-provenance.env"
          python3 - "${manifest}" "${source_env}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          manifest_path, env_path = map(Path, sys.argv[1:])
          document = json.loads(manifest_path.read_text(encoding="utf-8"))
          snapshot_id = document.get("snapshot_id")
          tree_digest = document.get("tree_digest")
          if not isinstance(snapshot_id, str) or re.fullmatch(
              r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",
              snapshot_id,
          ) is None:
              raise SystemExit("source manifest has no canonical snapshot_id")
          if not isinstance(tree_digest, str) or re.fullmatch(r"[0-9a-f]{64}", tree_digest) is None:
              raise SystemExit("source manifest has no lowercase tree_digest")
          env_path.write_text(
              f"SRB_SOURCE_SNAPSHOT_ID={snapshot_id}\nSRB_SOURCE_TREE_DIGEST={tree_digest}\n",
              encoding="utf-8",
          )
          PY
          manifest_sha256="$(sha256sum "${manifest}" | awk '{print $1}')"
          snapshot_id="$(sed -n 's/^SRB_SOURCE_SNAPSHOT_ID=//p' "${source_env}")"
          tree_digest="$(sed -n 's/^SRB_SOURCE_TREE_DIGEST=//p' "${source_env}")"
          {
            printf 'SRB_SOURCE_SNAPSHOT_ID=%s\n' "${snapshot_id}"
            printf 'SRB_SOURCE_TREE_DIGEST=%s\n' "${tree_digest}"
            printf 'SRB_SOURCE_PROVENANCE_MANIFEST=%s\n' "${manifest}"
            printf 'SRB_SOURCE_MANIFEST_SHA256=%s\n' "${manifest_sha256}"
            printf 'SRB_SOURCE_PROVENANCE_HELPER=%s\n' "${SRB_SOURCE_TOOL_DIR}/source_provenance.bash"
          } > "${source_env}"
          cat "${source_env}" >> "${GITHUB_ENV}"
          printf 'SRB_SOURCE_ENV_FILE=%s\n' "${source_env}" >> "${GITHUB_ENV}"

      - name: Resolve immutable amd64 base image
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          base_name="$(sed -n 's/^ARG BASE_IMAGE_NAME="\(.*\)"$/\1/p' "${GITHUB_WORKSPACE}/Dockerfile" | head -n 1)"
          base_tag="$(sed -n 's/^ARG BASE_IMAGE_TAG="\(.*\)"$/\1/p' "${GITHUB_WORKSPACE}/Dockerfile" | head -n 1)"
          [[ -n "${base_name}" && -n "${base_tag}" && "${base_tag}" != *@* ]] || fail "Dockerfile base image declaration is not a plain reviewed tag"
          base_ref="${base_name}:${base_tag}"
          raw="${RUNNER_TEMP}/srb-base-image.raw.json"
          docker buildx imagetools inspect "${base_ref}" --raw > "${raw}"
          digest="$(python3 - "${raw}" <<'PY'
          import json
          import sys

          document = json.load(open(sys.argv[1], encoding="utf-8"))
          for descriptor in document.get("manifests", []):
              platform = descriptor.get("platform", {})
              if platform.get("os") == "linux" and platform.get("architecture") == "amd64":
                  print(descriptor.get("digest", ""))
                  break
          PY
          )"
          if [[ -z "${digest}" ]]; then
            digest="$(docker buildx imagetools inspect "${base_ref}" --format '{{.Manifest.Digest}}')"
          fi
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "base image did not resolve to an amd64 digest"
          base_env="${RUNNER_TEMP}/srb-base-image.env"
          {
            printf 'SRB_BASE_IMAGE_NAME=%s\n' "${base_name}"
            printf 'SRB_BASE_IMAGE_TAG=%s\n' "${base_tag}"
            printf 'SRB_BASE_IMAGE_DIGEST=%s\n' "${digest}"
            printf 'SRB_BASE_IMAGE_TAG_PINNED=%s@%s\n' "${base_tag}" "${digest}"
          } > "${base_env}"
          python3 - "${RUNNER_TEMP}/srb-base-image.json" "${base_name}" "${base_tag}" "${digest}" <<'PY'
          import json
          import sys
          from pathlib import Path

          output, name, tag, digest = sys.argv[1:]
          Path(output).write_text(
              json.dumps(
                  {
                      "name": name,
                      "tag": tag,
                      "digest": digest,
                      "platform": "linux/amd64",
                      "build_arg": f"{tag}@{digest}",
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          cat "${base_env}" >> "${GITHUB_ENV}"
          printf 'SRB_BASE_ENV_FILE=%s\n' "${base_env}" >> "${GITHUB_ENV}"

      - name: Verify source before strict build
        shell: bash
        run: |
          set -Eeuo pipefail
          source "${SRB_SOURCE_ENV_FILE}"
          bash "${SRB_SOURCE_PROVENANCE_HELPER}" verify \
            --root "${GITHUB_WORKSPACE}" --manifest "${SRB_SOURCE_PROVENANCE_MANIFEST}" \
            --expected-snapshot-id "${SRB_SOURCE_SNAPSHOT_ID}" \
            --expected-tree-digest "${SRB_SOURCE_TREE_DIGEST}" --json \
            > "${RUNNER_TEMP}/source-prebuild-verify.json"

      - name: Strict release build before login
        id: strict-build
        env:
          METADATA_LABELS: ${{ steps.metadata.outputs.labels }}
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          source "${SRB_SOURCE_ENV_FILE}"
          source "${SRB_BASE_ENV_FILE}"
          [[ -n "${METADATA_LABELS}" ]] || fail "metadata action produced no OCI labels"
          metadata_label_args=()
          while IFS= read -r label; do
            [[ -z "${label}" ]] && continue
            [[ "${label}" == *=* ]] || fail "metadata label is not key=value"
            key="${label%%=*}"
            value="${label#*=}"
            [[ "${key}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || fail "metadata label key is malformed: ${key}"
            case "${key}" in
              org.space-robotics-bench.source.provenance-version|org.space-robotics-bench.source.snapshot-id|org.space-robotics-bench.source.tree-digest)
                fail "metadata action attempted to set a protected source label: ${key}"
                ;;
            esac
            [[ "${value}" != *$'\r'* && "${value}" != *$'\n'* ]] || fail "metadata label value contains a line break: ${key}"
            metadata_label_args+=(--label "${label}")
          done <<< "${METADATA_LABELS}"
          iid_file="${RUNNER_TEMP}/srb-release-build.iid"
          rm -f -- "${iid_file}"
          SRB_SOURCE_PROVENANCE_REQUIRED=1 \
          SRB_SOURCE_SNAPSHOT_ID="${SRB_SOURCE_SNAPSHOT_ID}" \
          SRB_SOURCE_TREE_DIGEST="${SRB_SOURCE_TREE_DIGEST}" \
          SRB_SOURCE_PROVENANCE_HELPER="${SRB_SOURCE_PROVENANCE_HELPER}" \
          SRB_SOURCE_PROVENANCE_MANIFEST="${SRB_SOURCE_PROVENANCE_MANIFEST}" \
          SRB_BUILD_NETWORK=default \
          SRB_IMAGE_NAME="srb-release" \
            "${GITHUB_WORKSPACE}/.docker/build.bash" "${GITHUB_SHA}" \
            "${metadata_label_args[@]}" \
            --platform linux/amd64 --iidfile "${iid_file}" \
            --build-arg "BASE_IMAGE_NAME=${SRB_BASE_IMAGE_NAME}" \
            --build-arg "BASE_IMAGE_TAG=${SRB_BASE_IMAGE_TAG_PINNED}"
          [[ -s "${iid_file}" ]] || { echo "::error::strict builder produced no IID"; exit 1; }
          printf 'SRB_IID_FILE=%s\n' "${iid_file}" >> "${GITHUB_ENV}"
          printf 'SRB_IMAGE_IID=%s\n' "$(<"${iid_file}")" >> "${GITHUB_ENV}"

      - name: Verify source after strict build
        shell: bash
        run: |
          set -Eeuo pipefail
          source "${SRB_SOURCE_ENV_FILE}"
          bash "${SRB_SOURCE_PROVENANCE_HELPER}" verify \
            --root "${GITHUB_WORKSPACE}" --manifest "${SRB_SOURCE_PROVENANCE_MANIFEST}" \
            --expected-snapshot-id "${SRB_SOURCE_SNAPSHOT_ID}" \
            --expected-tree-digest "${SRB_SOURCE_TREE_DIGEST}" --json \
            > "${RUNNER_TEMP}/source-postbuild-verify.json"

      - name: Validate fresh IID and light CLI smoke before login
        shell: bash
        run: |
          set -Eeuo pipefail
          source "${SRB_SOURCE_ENV_FILE}"
          iid="$(<"${SRB_IID_FILE}")"
          [[ "${iid}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::malformed strict IID"; exit 1; }
          platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${iid}")"
          [[ "${platform}" == "linux/amd64" ]] || { echo "::error::fresh IID platform is ${platform}, expected linux/amd64"; exit 1; }
          record="$(docker image inspect --format '{{.Id}}{{"\t"}}{{index .Config.Labels "org.space-robotics-bench.source.provenance-version"}}{{"\t"}}{{index .Config.Labels "org.space-robotics-bench.source.snapshot-id"}}{{"\t"}}{{index .Config.Labels "org.space-robotics-bench.source.tree-digest"}}' "${iid}")"
          [[ "${record}" == "${iid}"$'\t1\t'"${SRB_SOURCE_SNAPSHOT_ID}"$'\t'"${SRB_SOURCE_TREE_DIGEST}" ]] || { echo "::error::fresh IID source labels do not match"; exit 1; }
          docker run --rm --entrypoint bash "${iid}" -lc 'srb --help && python3 -c "import srb.cli.registry"'
          evidence="${RUNNER_TEMP}/srb-docker-publish-evidence"
          mkdir -p "${evidence}"
          docker image inspect "${iid}" > "${evidence}/local-image-inspect.json"
          cp -- "${SRB_SOURCE_PROVENANCE_MANIFEST}" "${evidence}/source-manifest.json"
          cp -- "${SRB_IID_FILE}" "${evidence}/image.iid"
          cp -- "${RUNNER_TEMP}/srb-base-image.json" "${evidence}/base-image.json"
          cp -- "${RUNNER_TEMP}/source-prebuild-verify.json" "${evidence}/source-prebuild-verify.json"
          cp -- "${RUNNER_TEMP}/source-postbuild-verify.json" "${evidence}/source-postbuild-verify.json"

      - name: Fail closed outside the public attestation target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REPOSITORY}" == "AndrejOrsula/space_robotics_bench" ]] || {
            echo "::error::release signing is allowlisted only for the reviewed public repository AndrejOrsula/space_robotics_bench; refusing publication before registry login/push" >&2
            exit 1
          }
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || {
            echo "::error::GitHub OIDC entitlement is unavailable; refusing publication before push" >&2
            exit 1
          }
          command -v gh >/dev/null 2>&1 || { echo "::error::gh CLI is required for attestation verification" >&2; exit 1; }
          visibility="$(gh api --hostname github.com "repos/${GITHUB_REPOSITORY}" --jq '.visibility')"
          [[ "${visibility}" == "public" ]] || {
            echo "::error::repository visibility is ${visibility}; OCI attestation publication requires a public repository" >&2
            exit 1
          }

      - name: Detect optional Docker Hub credentials
        id: dockerhub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_PASSWORD}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      ## Login to Docker Hub and/or GitHub container registry
      - name: Login to GitHub container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub when configured
        if: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      ## Build and push if the workflow was triggered by a release
      - name: Push exact fresh IID to metadata aliases
        shell: bash
        env:
          METADATA_TAGS: ${{ steps.metadata.outputs.tags }}
          DOCKERHUB_ENABLED: ${{ steps.dockerhub.outputs.enabled }}
        run: |
          set -Eeuo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          iid="$(<"${SRB_IID_FILE}")"
          [[ "${iid}" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "strict IID is malformed before push"
          primary=""
          : > "${RUNNER_TEMP}/srb-ghcr-tags.txt"
          : > "${RUNNER_TEMP}/srb-pushed-tags.txt"
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            case "${tag}" in
              ghcr.io/*)
                [[ -n "${primary}" ]] || primary="${tag}"
                printf '%s\n' "${tag}" >> "${RUNNER_TEMP}/srb-ghcr-tags.txt"
                ;;
              */*)
                [[ "${DOCKERHUB_ENABLED}" == "true" ]] || continue
                ;;
              *) fail "metadata produced an unqualified image tag: ${tag}" ;;
            esac
            docker tag "${iid}" "${tag}"
            docker push "${tag}"
            printf '%s\n' "${tag}" >> "${RUNNER_TEMP}/srb-pushed-tags.txt"
          done <<< "${METADATA_TAGS}"
          [[ -n "${primary}" ]] || fail "metadata produced no GHCR image alias"
          printf 'SRB_PRIMARY_TAG=%s\n' "${primary}" >> "${GITHUB_ENV}"

      - name: Pull and smoke-test the published digest
        shell: bash
        run: |
          set -Eeuo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          source "${SRB_SOURCE_ENV_FILE}"
          primary="${SRB_PRIMARY_TAG}"
          repository="${primary%:*}"
          digest="$(docker buildx imagetools inspect "${primary}" --format '{{.Manifest.Digest}}')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "registry did not return an immutable digest"
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            observed="$(docker buildx imagetools inspect "${tag}" --format '{{.Manifest.Digest}}')"
            [[ "${observed}" == "${digest}" ]] || fail "metadata GHCR alias ${tag} resolved to a different digest"
          done < "${RUNNER_TEMP}/srb-ghcr-tags.txt"
          immutable="${repository}@${digest}"
          [[ "${immutable}" == *@sha256:* && "${immutable}" != *:*:*@sha256:* ]] || fail "immutable reference is malformed"
          docker pull "$immutable"
          docker image inspect "$immutable" > "${RUNNER_TEMP}/srb-docker-publish-evidence/registry-image-inspect.json"
          python3 "${GITHUB_WORKSPACE}/${CONTAINER_PROVENANCE}" inspect \
            --inspect-json "${RUNNER_TEMP}/srb-docker-publish-evidence/registry-image-inspect.json" \
            --image-iid "${SRB_IMAGE_IID}" --repository "${repository}" \
            --registry-digest "${digest}" --source-snapshot-id "${SRB_SOURCE_SNAPSHOT_ID}" \
            --source-tree-digest "${SRB_SOURCE_TREE_DIGEST}" \
            > "${RUNNER_TEMP}/srb-docker-publish-evidence/image-identity.json"
          python3 - "${RUNNER_TEMP}/srb-docker-publish-evidence/image-identity.json" <<'PY' >> "${GITHUB_ENV}"
          import json
          import sys
          from pathlib import Path

          values = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for key, value in values.items():
              print(f"SRB_{key.upper()}={value}")
              if key == "repository":
                  print(f"SRB_REGISTRY_REPOSITORY={value}")
          print(f"SRB_IMMUTABLE_IMAGE={values['repository']}@{values['registry_digest']}")
          PY
          docker run --rm --entrypoint bash "$immutable" -lc 'srb --help && python3 -c "import srb.cli.registry"'

      - name: Generate and validate signed predicate
        shell: bash
        run: |
          set -Eeuo pipefail
          source "${SRB_SOURCE_ENV_FILE}"
          source "${SRB_BASE_ENV_FILE}"
          evidence="${RUNNER_TEMP}/srb-docker-publish-evidence"
          predicate="${evidence}/build-predicate.json"
          python3 "${GITHUB_WORKSPACE}/${CONTAINER_PROVENANCE}" generate \
            --source-manifest "${SRB_SOURCE_PROVENANCE_MANIFEST}" \
            --source-repository "${GITHUB_REPOSITORY}" --source-commit "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" --source-snapshot-id "${SRB_SOURCE_SNAPSHOT_ID}" \
            --source-tree-digest "${SRB_SOURCE_TREE_DIGEST}" --repository "${SRB_REGISTRY_REPOSITORY}" \
            --image-iid "${SRB_IMAGE_IID}" --registry-digest "${SRB_REGISTRY_DIGEST}" \
            --architecture "${SRB_ARCHITECTURE}" --base-image-digest "${SRB_BASE_IMAGE_DIGEST}" \
            --isaac-sim-sha "${SRB_ISAAC_SIM_SHA}" --isaac-lab-sha "${SRB_ISAAC_LAB_SHA}" \
            --isaac-sim-version "${SRB_ISAAC_SIM_VERSION}" --isaac-lab-version "${SRB_ISAAC_LAB_VERSION}" \
            --isaac-lab-isaac-sim-version "${SRB_ISAAC_LAB_ISAAC_SIM_VERSION}" \
            --output "${predicate}" --json > "${evidence}/predicate-generation.json"
          python3 "${GITHUB_WORKSPACE}/${CONTAINER_PROVENANCE}" validate \
            --predicate "${predicate}" --json > "${evidence}/predicate-validation.json"
          printf 'SRB_PREDICATE_FILE=%s\n' "${predicate}" >> "${GITHUB_ENV}"

      - name: Sign immutable OCI subject with source predicate
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.SRB_REGISTRY_REPOSITORY }}
          subject-digest: ${{ env.SRB_REGISTRY_DIGEST }}
          predicate-type: ${{ env.PREDICATE_TYPE }}
          predicate-path: ${{ env.SRB_PREDICATE_FILE }}
          create-storage-record: false

      - name: Retain Sigstore bundle
        if: ${{ always() }}
        shell: bash
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -Eeuo pipefail
          evidence="${RUNNER_TEMP}/srb-docker-publish-evidence"
          [[ -n "${ATTESTATION_BUNDLE_PATH}" && -f "${ATTESTATION_BUNDLE_PATH}" ]] || {
            echo "::error::actions/attest did not expose a Sigstore bundle" >&2
            exit 1
          }
          cp -- "${ATTESTATION_BUNDLE_PATH}" "${evidence}/sigstore-bundle.json"

      - name: Verify attestation and cross-check predicate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          evidence="${RUNNER_TEMP}/srb-docker-publish-evidence"
          gh attestation verify --hostname github.com "oci://${SRB_IMMUTABLE_IMAGE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/docker.yml" \
            --signer-digest "${GITHUB_SHA}" --source-digest "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" --predicate-type "${PREDICATE_TYPE}" \
            --format json > "${evidence}/verification-result.json"
          python3 "${GITHUB_WORKSPACE}/${CONTAINER_PROVENANCE}" verify \
            --attestation "${evidence}/verification-result.json" --expected "${SRB_PREDICATE_FILE}" \
            --predicate-type "${PREDICATE_TYPE}" --json > "${evidence}/verified-predicate.json"

      - name: Upload signed release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-release-evidence
          path: ${{ runner.temp }}/srb-docker-publish-evidence
          if-no-files-found: warn
          retention-days: 90

      - name: Remove local publication images
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          remove_image() {
            local inspect_error
            docker image rm -f "$1" >/dev/null 2>&1 || :
            if docker image inspect "$1" >/dev/null 2>&1; then
              echo "::warning title=Docker cleanup::image $1 is still present after removal"
            elif ! inspect_error="$(docker image inspect "$1" 2>&1 >/dev/null)" \
              && ! grep -qi "no such image" <<<"${inspect_error}"; then
              echo "::warning title=Docker cleanup::could not verify removal of image $1: ${inspect_error}"
            fi
          }
          if [[ -f "${RUNNER_TEMP}/srb-pushed-tags.txt" ]]; then
            while IFS= read -r tag; do
              [[ -z "${tag}" ]] || remove_image "${tag}"
            done < "${RUNNER_TEMP}/srb-pushed-tags.txt"
          fi
          if [[ -s "${RUNNER_TEMP}/srb-release-build.iid" ]]; then
            remove_image "$(<"${RUNNER_TEMP}/srb-release-build.iid")"
          fi
